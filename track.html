<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>অর্ডার ট্র্যাক — তেইশ টাকা</title>
<link href="https://fonts.googleapis.com/css2?family=Atma:wght@500;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;font:18px/1.8 'Hind Siliguri',sans-serif;background:#FBE0D8;color:#3B2318;padding:20px}main{max-width:520px;margin:20px auto;background:#fff;border:3px solid #3B2318;border-radius:14px;padding:22px;box-shadow:6px 6px 0 #FFC93C}
h1{font:700 2rem Atma;color:#D8382F;margin:0 0 8px}label{display:block;font-weight:600;margin-top:10px}input{width:100%;font:inherit;padding:9px 12px;border:2px solid #3B2318;border-radius:10px}
button{margin-top:14px;background:#FFC93C;border:2px solid #3B2318;border-radius:999px;padding:8px 28px;font:700 1.1rem Atma;cursor:pointer;box-shadow:3px 3px 0 #3B2318}
.st{display:flex;margin:18px 0 6px}.st div{flex:1;text-align:center;font-size:.85rem;border-top:6px solid #ddd;padding-top:6px;color:#999}.st .on{border-color:#D8382F;color:#3B2318;font-weight:600}
#res{margin-top:14px;font-weight:600}a{color:#1F7A8C}</style></head><body><main><h1>অর্ডার ট্র্যাক করো</h1>
<label>অর্ডার আইডি <small>(ইমেইলে পাওয়া)</small></label><input id="i" placeholder="T..."><label>অর্ডারের সময় দেওয়া ইমেইল</label><input id="e" type="email">
<button id="b">দেখো</button><div id="res" role="status"></div><p><a href="/">← হোম পেজে ফিরে যাও</a></p></main>
<script>const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]),E=v=>String(v||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const LB={Pending:'অপেক্ষায়',Paid:'পেমেন্ট পেয়েছি',Packed:'প্যাক হয়েছে',Written:'লেখা হয়েছে',Delivered:'পৌঁছে গেছে'};
b.onclick=async()=>{res.textContent='...';try{const r=await fetch('/api/track?id='+encodeURIComponent(i.value)+'&email='+encodeURIComponent(e.value)),j=await r.json();if(!r.ok)throw Error(j.error);
const shop=j.kind==='shop',nm=shop?'':'প্রাপক: '+E(j.recName)+'<br>';
let h=nm;
if(j.status=='Cancelled')h+='অর্ডার বাতিল হয়েছে।';
else{const L=shop?['Pending','Paid','Packed',...(j.hasLetter?['Written']:[]),'Delivered']:['Pending','Paid','Written','Delivered'],k=L.indexOf(j.status);h+='<div class="st">'+L.map((x,n)=>`<div class="${n<=k?'on':''}">${LB[x]}</div>`).join('')+'</div>'}
if(shop){h+='<div style="font-weight:400;margin-top:10px">'+j.lines.map(l=>`<div style="${l.ok?'':'text-decoration:line-through;opacity:.6'}">${E(l.name)} × ${bn(l.qty)} = ${bn(l.price*l.qty)}৳${l.ok?'':' (স্টকে নেই)'}</div>`).join('')+`<div>ডেলিভারি চার্জ: ${bn(j.delivery)}৳</div><div><b>মোট: ${bn(j.total)}৳</b> · অনলাইনে দিয়েছ: ${bn(j.paidOnline)}৳</div>`+(j.due?`<div>ডেলিভারির সময় ডেলিভারি ম্যানকে দিতে হবে: <b>${bn(j.due)}৳</b></div>`:'')+(j.refundDue?`<div style="color:#D8382F">ফেরত পাবে: <b>${bn(j.refundDue)}৳</b>${j.refundDone?' (ফেরত দেওয়া হয়েছে)':''}</div>`:'')+'</div>'}
if(j.custMsg)h+='<div style="margin-top:10px;background:#FFF6E5;border-left:5px solid #D8382F;padding:8px 12px;font-weight:400">'+E(j.custMsg).replace(/\n/g,'<br>')+'</div>';
res.innerHTML=h}catch(x){res.textContent=x.message||'কিছু ভুল হয়েছে'}};</script></body></html>
